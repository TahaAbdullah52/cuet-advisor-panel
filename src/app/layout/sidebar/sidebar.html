<!-- Academic Sidebar Navigation -->
<aside class="w-64 academic-sidebar h-screen flex flex-col fixed top-0 left-0 z-40">
  
  <!-- CUET Header -->
  <div class="p-6 border-b border-blue-800">
    <div class="flex items-center space-x-3">
      <div class="w-15 h-15 bg-white rounded-full flex items-center justify-center">
        <img
          src="assets/images/CUET-Official-Logo.jpg"
          alt="CUET Logo"
          class="w-12 h-12 object-contain"/>
      </div>
      <div>
        <h2 class="text-lg font-semibold text-white">Advisor Panel</h2>
        <p class="text-xs text-blue-200">CSE Department</p>
      </div>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 p-6 overflow-y-auto">
    <div class="space-y-2">
      
      <!-- Dashboard -->
      <a routerLink="/dashboard" 
         routerLinkActive="bg-blue-800 bg-opacity-50"
         class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white hover:bg-blue-800 hover:bg-opacity-30 transition-all duration-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5a2 2 0 012-2h4a2 2 0 012 2v6H8V5z"></path>
        </svg>
        <span class="font-medium">Dashboard</span>
      </a>

      <!-- Students -->
      <a routerLink="/students" 
         routerLinkActive="bg-blue-800 bg-opacity-50"
         class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white hover:bg-blue-800 hover:bg-opacity-30 transition-all duration-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
        </svg>
        <span class="font-medium">Students</span>
      </a>

      <!-- Thesis -->
      <a routerLink="/thesis" 
         routerLinkActive="bg-blue-800 bg-opacity-50"
         class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white hover:bg-blue-800 hover:bg-opacity-30 transition-all duration-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
        <span class="font-medium">Thesis</span>
      </a>

      <!-- Routine -->
      <a routerLink="/routine" 
         routerLinkActive="bg-blue-800 bg-opacity-50"
         class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white hover:bg-blue-800 hover:bg-opacity-30 transition-all duration-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3a1 1 0 012 0v4m0 0V3a1 1 0 012 0v4m0 0h4l-4 4-4-4h4z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21h18M5 21V7a2 2 0 012-2h10a2 2 0 012 2v14M9 12h6m-6 4h6"></path>
        </svg>
        <span class="font-medium">Routine</span>
      </a>

      <!-- Settings -->
      <a routerLink="/settings" 
         routerLinkActive="bg-blue-800 bg-opacity-50"
         class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white hover:bg-blue-800 hover:bg-opacity-30 transition-all duration-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span class="font-medium">Settings</span>
      </a>

    </div>
  </nav>

  <!-- User Info & Logout -->
  <div class="p-6 border-t border-blue-800 flex-shrink-0">
    <div class="mb-4">
      <!-- <p class="text-sm text-blue-200">Logged in as</p> -->
      <p class="text-white font-medium">{{ advisorName }}</p>
      <p class="text-xs text-blue-300">{{ advisorEmail }}</p>
    </div>
    
    <button 
      (click)="logout()"
      class="flex items-center space-x-2 w-full px-4 py-2 text-left text-blue-200 hover:text-white hover:bg-blue-800 hover:bg-opacity-30 rounded-lg transition-all duration-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      <span class="text-sm">Logout</span>
    </button>
  </div>

</aside>
