<!-- CUET Advisor Login Page -->
<div class="min-h-screen bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    
    <!-- CUET Header -->
    <div class="text-center mb-8">
      <div class="w-21 h-21 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
        <img
          src="assets/images/CUET-Official-Logo.jpg"
          alt="CUET Logo"
          class="w-15 h-15 object-contain"/>
      </div>
      <h1 class="text-3xl font-bold academic-title mb-2">
        Chittagong University of Engineering & Technology
      </h1>
      <p class="academic-subtitle text-lg">
        Advisor Panel Login
      </p>
    </div>

    <!-- Login Form -->
    <div class="academic-card p-15 w-170 mx-auto ">
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        
        <!-- Email Field -->
        <div class="mb-6">
          <label class="block text-xl font-semibold academic-text mb-2">
            Email Address
          </label>
          <input 
            type="email" 
            [(ngModel)]="email"
            name="email"
            required
            email
            class="academic-input"
            placeholder="advisor@cuet.ac.bd"
            [disabled]="isLoading">
        </div>

        <!-- Password Field -->
        <div class="mb-6">
          <label class="block text-xl font-semibold academic-text mb-2">
            Password
          </label>
          <input 
            type="password" 
            [(ngModel)]="password"
            name="password"
            required
            minlength="6"
            class="academic-input"
            placeholder="Enter your password"
            [disabled]="isLoading">
        </div>

        <!-- Login Button -->
         <div class="flex justify-center">
          <button 
            type="submit"
            [disabled]="!loginForm.form.valid || isLoading"
            class="w-40 mt-5 btn-primary py-3 text-lg font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
            
            <span *ngIf="!isLoading">Sign In</span>
            <span *ngIf="isLoading" class="flex items-center justify-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Signing In...
            </span>
          </button>
        </div>


        <!-- Error Message -->
        <div *ngIf="errorMessage" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
          <p class="text-sm text-red-700 text-center">{{ errorMessage }}</p>
        </div>

        <!-- Data Source Indicator -->
        <!-- <div class="mt-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
          <div class="flex items-center justify-center space-x-2">
            <div class="w-2 h-2 rounded-full" 
                 [class.bg-green-500]="!isUsingMockData"
                 [class.bg-yellow-500]="isUsingMockData"></div>
            <span class="text-xs text-blue-700">
              {{ isUsingMockData ? 'Using Mock Authentication' : 'Connected to Database' }}
            </span>
          </div>
          <p *ngIf="isUsingMockData" class="text-xs text-blue-600 text-center mt-1">
            Default: advisor@cuet.ac.bd / pass12345
          </p>
        </div> -->

      </form>

      <!-- Footer -->
      <div class="mt-6 pt-6 border-t border-slate-200 text-center">
        <p class="text-sm academic-muted">
          Department of Computer Science & Engineering
        </p>
      </div>
    </div>

  </div>
</div>
